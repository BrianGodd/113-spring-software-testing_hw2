name: Node.js CI

on:
  push:
    branches: [HW2]
  pull_request:
    branches: [HW2]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
      
      - name: Run tests with coverage
        run: npm run coverage

      - name: Lint code
        run: ./node_modules/.bin/eslint .
