name: Node.js CI

on:
  push:
    branches: [HW2]
  pull_request:
    branches: [HW2]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npx jest